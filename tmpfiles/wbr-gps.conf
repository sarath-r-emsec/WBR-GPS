# Runtime directory for wbr-gpsd's socket, for the per-launcher model.
#
# /run is tmpfs, so this directory does not survive a reboot. The always-on
# systemd unit created it with RuntimeDirectory=; when the daemon is started
# per-launcher by an unprivileged user instead, that user cannot create a
# directory in /run at all -- so systemd-tmpfiles creates it at boot.
#
# Group-writable by dialout: the same group that already owns /dev/ttyACM0 and
# the GPSDO's hidraw node, so anyone permitted to read the device is permitted
# to serve it. No new privilege is granted.
#
# Install:  sudo cp tmpfiles/wbr-gps.conf /etc/tmpfiles.d/
#           sudo systemd-tmpfiles --create
d /run/wbr-gps 0775 root dialout -
